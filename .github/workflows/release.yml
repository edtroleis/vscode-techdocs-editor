# Release a cada tag v<versão> (ex.: v0.1.0): todas as suítes do CI, um único .vsix e, depois da aprovação
# manual do ambiente "release", o mesmo .vsix no Marketplace, no Open VSX e na release do GitHub (spec 03).
# Os tokens (VSCE_PAT e OVSX_PAT) são segredos do ambiente "release", não do repositório.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  pacote:
    name: empacotar o .vsix
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: A tag bate com a versão do package.json
        run: |
          version=$(node -p "require('./packages/extension/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $version de packages/extension/package.json"
            exit 1
          fi
      - name: O CHANGELOG tem a seção da versão
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md sem a seção [$version]"; exit 1; }
      # O vscode:prepublish faz o build de produção e copia os documentos da raiz (scripts/prepare-package.mjs).
      - run: npx vsce package --no-dependencies -o "techdocs-editor-${GITHUB_REF_NAME#v}.vsix"
        working-directory: packages/extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: packages/extension/*.vsix
          if-no-files-found: error
          retention-days: 30

  publicar:
    name: publicar
    needs: pacote
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      - name: Marketplace
        run: npx vsce publish --packagePath techdocs-editor-*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Open VSX
        run: npx ovsx publish techdocs-editor-*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Release do GitHub
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notas.md
          gh release create "$GITHUB_REF_NAME" techdocs-editor-*.vsix --title "$GITHUB_REF_NAME" --notes-file notas.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
