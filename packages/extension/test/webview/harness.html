<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- O mesmo bundle do webview, fora do VS Code: acquireVsCodeApi é simulado e as mensagens
       mandadas pelo editor ficam em window.sent. Os testes mandam as do host com window.postMessage. -->
  <link rel="stylesheet" href="../../dist/webview/main.css">
  <script>
    window.sent = [];
    window.acquireVsCodeApi = () => ({ postMessage: message => window.sent.push(message) });
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="../../dist/webview/main.js"></script>
</body>
</html>
