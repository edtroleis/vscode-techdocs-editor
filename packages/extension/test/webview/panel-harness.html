<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Bundle do painel "Publicação" fora do VS Code (ver harness.html): as mensagens do painel ficam em
       window.sent; os testes mandam o estado do host com window.postMessage. -->
  <script>
    window.sent = [];
    window.acquireVsCodeApi = () => ({ postMessage: message => window.sent.push(message) });
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="../../dist/webview/panel.js"></script>
</body>
</html>
